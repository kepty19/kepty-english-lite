<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepty English Lite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kepty-orange: #CE4A22; }
        body { font-family: 'Open Sans', 'Noto Sans JP', sans-serif; }
        .hero-bg {
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(206, 74, 34, 0.18), transparent 55%),
                radial-gradient(900px 500px at 100% 0%, rgba(15, 23, 42, 0.06), transparent 50%),
                linear-gradient(180deg, #fff 0%, #f8fafc 100%);
        }
    </style>
</head>
<body class="hero-bg min-h-screen text-slate-900">
    <main class="max-w-lg mx-auto px-6 pt-16 pb-20">
        <p class="text-[11px] font-black tracking-[0.2em] uppercase text-slate-400 mb-3">Free experience</p>
        <h1 class="text-4xl font-[900] tracking-tight mb-2">Kepty English <span style="color:var(--kepty-orange)">Lite</span></h1>
        <p class="text-slate-600 text-sm leading-relaxed mb-8">
            トレーニング8モジュールをお試しいただけます。Shadowingの音源再生と録音の共有は無料版ではご利用いただけません。
        </p>
        <a href="training.html"
           class="inline-flex items-center justify-center w-full rounded-2xl px-5 py-4 text-white font-bold text-sm shadow-sm"
           style="background:var(--kepty-orange)">
            トレーニングをはじめる
        </a>
        <button type="button" class="lite-contact-open mt-3 inline-flex items-center justify-center w-full rounded-2xl px-5 py-4 bg-white border border-slate-200 text-slate-700 font-bold text-sm">
            有料版のお申し込み・お問い合わせ
        </button>
        <ul class="mt-10 text-xs text-slate-500 space-y-2 leading-relaxed">
            <li>・Vocabulary / Pronunciation / Grammar / Reading など学習コンテンツは利用可</li>
            <li>・Shadowing：台本閲覧可・音源再生不可</li>
            <li>・録音：端末内のみ可・共有不可</li>
            <li>・進捗の端末間同期・LINE連携なし</li>
        </ul>
    </main>

    <!-- contact modal markup loaded via shared partial pattern in training; duplicate for index -->
    <div id="lite-contact-modal" class="fixed inset-0 z-[60000] flex items-center justify-center p-4" hidden aria-hidden="true">
        <div class="absolute inset-0 bg-slate-900/50" data-lite-contact-close></div>
        <div class="relative w-full max-w-md rounded-2xl bg-white shadow-xl border border-slate-100 overflow-hidden">
            <div class="flex items-center justify-between px-5 pt-5 pb-2">
                <h2 class="text-base font-black text-slate-900">Contact us</h2>
                <button type="button" class="w-8 h-8 rounded-full bg-slate-50 text-slate-400" data-lite-contact-close aria-label="閉じる">×</button>
            </div>
            <div id="lite-contact-reason-wrap" class="px-5 pb-2" hidden>
                <p id="lite-contact-reason" class="text-xs text-slate-600 leading-relaxed bg-orange-50 border border-orange-100 rounded-xl p-3"></p>
            </div>
            <div id="lite-contact-form-panel" class="px-5 pb-5">
                <form id="lite-contact-form" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 mb-1" for="lite-contact-name">お名前</label>
                        <input id="lite-contact-name" name="userName" required class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" autocomplete="name">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 mb-1" for="lite-contact-email">メールアドレス</label>
                        <input id="lite-contact-email" name="userEmail" type="email" required class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" autocomplete="email">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 mb-1" for="lite-contact-message">お問い合わせ内容</label>
                        <textarea id="lite-contact-message" name="userMessage" rows="4" required class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm"></textarea>
                    </div>
                    <p id="lite-contact-error" class="text-xs text-red-600" hidden></p>
                    <button id="lite-contact-submit" type="submit" class="w-full rounded-xl py-3 text-white text-sm font-bold" style="background:#CE4A22">Send Message</button>
                </form>
            </div>
            <div id="lite-contact-success" class="px-5 pb-6" hidden>
                <p class="text-sm text-slate-700 leading-relaxed">送信ありがとうございました。担当よりご連絡いたします。</p>
                <button type="button" class="mt-4 w-full rounded-xl py-3 bg-slate-100 text-sm font-bold text-slate-700" data-lite-contact-close>閉じる</button>
            </div>
        </div>
    </div>
    <script src="kepty-lite.js"></script>
</body>
</html>
